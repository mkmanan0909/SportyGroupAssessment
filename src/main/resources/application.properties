spring.application.name=sporty-live-events

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.client-id=${spring.application.name}-producer

sporty.kafka.topic=${SPORTY_KAFKA_TOPIC:live-event-scores}
sporty.kafka.publish.max-attempts=3
sporty.kafka.publish.backoff-ms=400
# Built-in MockScoreFeedController: same machine, default Tomcat port. If you change server.port, override this URL.
# Prefer -Dsporty.external-score.url-template=... or SPRING_APPLICATION_JSON; env SPORTY_EXTERNAL_SCORE_URL_TEMPLATE also works (relaxed binding).
sporty.external-score.url-template=http://127.0.0.1:8090/scores/{eventId}
sporty.poll-interval-ms=10000

logging.level.org.practice.sporty=INFO
server.port=8090
