# Kafka + optional bundled Spring app container.
#
# Broker only (JVM/Maven runs on host; bootstrap localhost:9092):
#   docker compose up -d
#
# Full stack on one host (Kafka + sporty in Docker network):
#   docker compose --profile app up -d --build
#
# Stop: docker compose down
services:
  broker:
    image: apache/kafka:latest
    container_name: sporty-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL: Kafka API for other containers on this compose network (sporty profile).
      # PLAINTEXT_HOST: Kafka API published to Docker host (:9092) for local JVM runners.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # PLAINTEXT_HOST is what clients receive from metadata after connecting to localhost:9092 on the Docker host.
      # For Kafka clients on *other machines*, create a .env with KAFKA_ADVERTISED_PUBLIC_HOST=<this VM DNS or IP>.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:29092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_PUBLIC_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  sporty:
    build: .
    image: sporty-live-events:latest
    container_name: sporty-app
    profiles: ["app"]
    depends_on:
      broker:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      # In-container mock scores: same JVM, loopback HTTP port matches server.port
      SERVER_PORT: "8080"
      JAVA_OPTS: "-Xmx512m"
